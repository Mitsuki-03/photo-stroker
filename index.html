    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>

      /* 選択カード用カスタムスタイル */
      .selected-card {
        outline: 6px solid #f59e0b !important;

        box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4) !important;

      /* カラーピッカーの潰れ・スタイル崩れ防止 */

<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
      <!-- ヘッダー -->
      <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-900">ヤフオク用 画像一括サイズ調整 ＆ 二重フチ取りツール</h1>
        <p class="text-sm text-slate-600 mt-1">
          キャンバスサイズ・余白背景色・二重フチを自在に調整できます。Ctrl＋クリックで複数選択、画像クリックで個別編集、何もない場所をクリックで全体編集に戻ります。
        </p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 左側：設定パネル -->
        <div class="lg:col-span-1 space-y-6">
          <!-- ドロップゾーン -->
          <div id="drop-zone" class="border-2 border-dashed border-blue-400 bg-blue-50/50 hover:bg-blue-50 rounded-2xl p-6 text-center cursor-pointer transition-all">
            <svg class="w-12 h-12 mx-auto text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <p class="font-semibold text-blue-900 text-sm">ここに画像をドラッグ＆ドロップ</p>
            <p class="text-xs text-blue-600 mt-1">またはクリックしてファイルを選択（複数可）</p>
            <input type="file" id="file-input" class="hidden" accept="image/*" multiple />
          </div>

          <!-- 編集設定 -->
          <div id="settings-panel" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <div class="border-b pb-2 flex justify-between items-center">
              <h2 class="font-bold text-slate-900" id="settings-title">一括編集設定</h2>
              <span id="target-mode-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-100 text-blue-800">全体に適用</span>
            </div>

            <!-- 選択中画像の削除ボタン（選択時のみ表示） -->
            <div id="delete-action-area" class="hidden">
              <button id="btn-delete-selected" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2 px-3 rounded-xl border border-red-200 transition-all text-xs flex items-center justify-center space-x-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                <span id="btn-delete-text">選択中の画像を削除</span>
              </button>
            </div>

            <!-- キャンバス基本設定（サイズ・余白背景色） -->
            <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <h3 class="text-xs font-bold text-slate-800 border-b border-slate-200 pb-1">キャンバス設定 (1:1 固定)</h3>
              <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                  <label class="text-[11px] font-semibold text-slate-600">画像サイズ (px)</label>
                  <input type="number" id="canvas-size" value="1200" min="100" max="4000" step="10" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white" />
                </div>
                <div class="space-y-1">
                  <label class="text-[11px] font-semibold text-slate-600">余白の背景色</label>
                  <input type="color" id="bg-color" value="#FFFFFF" class="w-full h-[38px] rounded-lg cursor-pointer border border-slate-300 block" />
                </div>
              </div>
            </div>

            <!-- フチの適用範囲・方向 -->
            <div class="space-y-3">
              <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-700">フチを適用する対象</label>
                <select id="target-scope" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                  <option value="image">本来の画像の部分だけ</option>
                  <option value="canvas">キャンバス全体（余白含む）</option>
                </select>
              </div>

              <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-700">フチの方向（揃え方）</label>
                <select id="border-align" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                  <option value="outside" selected>外側揃え（端にフィット）</option>
                  <option value="inside">内側揃え（内側へ描画）</option>
                </select>
              </div>
            </div>

            <hr class="border-slate-100" />

            <!-- 1層目（外側フチ・橙）設定 -->
            <div class="space-y-3 bg-orange-50/50 p-4 rounded-xl border border-orange-100">
              <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-orange-900">1層目：外側フチ（一番外側）</label>
                <input type="color" id="outer-color" value="#F58220" class="w-8 h-8 rounded-lg border border-slate-300 cursor-pointer" />
              </div>
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-orange-800">
                  <span>太さ</span>
                  <span id="outer-size-val">30px</span>
                </div>
                <input type="range" id="outer-size" min="0" max="100" value="30" class="w-full accent-orange-500" />
              </div>
            </div>

            <!-- 2層目（内側フチ・白）設定 -->
            <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-slate-900">2層目：内側フチ（画像/1層目の間に挟む）</label>
                <input type="color" id="inner-color" value="#FFFFFF" class="w-8 h-8 rounded-lg border border-slate-300 cursor-pointer" />
              </div>
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-700">
                  <span>太さ</span>
                  <span id="inner-size-val">30px</span>
                </div>
                <input type="range" id="inner-size" min="0" max="100" value="30" class="w-full accent-blue-500" />
              </div>
            </div>

            <!-- アクションボタン -->
            <div class="pt-2 space-y-2">
              <button id="btn-download-all" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition-all text-sm hidden">
                すべて一括ダウンロード
              </button>
            </div>
          </div>
        </div>

        <!-- 右側：プレビュー＆結果エリア -->
        <div class="lg:col-span-2 space-y-4">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 min-h-[500px] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
              <h2 class="font-bold text-slate-900">処理済み画像一覧 (<span id="image-count">0</span>件)</h2>
              <span class="text-xs text-slate-500">※Ctrl+クリックで複数選択／背景クリックで全選択復帰</span>
            </div>

            <!-- プレビューグリッド -->
            <div id="preview-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto max-h-[700px] pr-2 p-1">
              <div id="empty-state" class="col-span-full py-20 text-center text-slate-400">
                <svg class="w-16 h-16 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <p class="text-sm">画像がまだ追加されていません</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript処理ロジック -->
    <script>
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const previewContainer = document.getElementById("preview-container");
      const emptyState = document.getElementById("empty-state");
      const imageCount = document.getElementById("image-count");
      const btnDownloadAll = document.getElementById("btn-download-all");

      const settingsTitle = document.getElementById("settings-title");
      const targetModeBadge = document.getElementById("target-mode-badge");
      const deleteActionArea = document.getElementById("delete-action-area");
      const btnDeleteSelected = document.getElementById("btn-delete-selected");
      const btnDeleteText = document.getElementById("btn-delete-text");

      const canvasSizeInput = document.getElementById("canvas-size");
      const bgColorInput = document.getElementById("bg-color");

      const outerColorInput = document.getElementById("outer-color");
      const outerSizeInput = document.getElementById("outer-size");
      const outerSizeVal = document.getElementById("outer-size-val");

      const innerColorInput = document.getElementById("inner-color");
      const innerSizeInput = document.getElementById("inner-size");
      const innerSizeVal = document.getElementById("inner-size-val");

      const targetScopeSelect = document.getElementById("target-scope");
      const borderAlignSelect = document.getElementById("border-align");

      let globalSettings = {
        canvasSize: 1200,
        bgColor: "#FFFFFF",
        outerColor: "#F58220",
        outerSize: 30,
        innerColor: "#FFFFFF",
        innerSize: 30,
        targetScope: "image",
        borderAlign: "outside",
      };

      let uploadedFiles = [];
      let selectedImageIds = [];
      let renderTimer = null;

      outerSizeInput.addEventListener("input", () => {
        outerSizeVal.textContent = outerSizeInput.value + "px";
        handleSettingChange();
      });
      innerSizeInput.addEventListener("input", () => {
        innerSizeVal.textContent = innerSizeInput.value + "px";
        handleSettingChange();
      });

      [canvasSizeInput, targetScopeSelect, borderAlignSelect].forEach((el) => {
        el.addEventListener("change", () => handleSettingChange(true));
      });

      [bgColorInput, outerColorInput, innerColorInput].forEach((el) => {
        el.addEventListener("input", () => handleSettingChange(false));
        el.addEventListener("change", () => handleSettingChange(true));
      });

      btnDeleteSelected.addEventListener("click", () => {
        if (selectedImageIds.length === 0) return;
        uploadedFiles = uploadedFiles.filter(
          (item) => !selectedImageIds.includes(item.id),
        );
        selectedImageIds = [];
        updateImageCount();
        updateUIForSelection();
        syncFormWithConfig(globalSettings);
        renderAllPreviews();
      });

      document.addEventListener("click", (e) => {
        if (selectedImageIds.length === 0) return;
        const isCard = e.target.closest(".image-card");
        const isSettings = e.target.closest("#settings-panel");
        const isDropZone = e.target.closest("#drop-zone");

        if (!isCard && !isSettings && !isDropZone) {
          resetToGlobalMode();
        }
      });

      function resetToGlobalMode() {
        selectedImageIds = [];
        updateUIForSelection();
        syncFormWithConfig(globalSettings);
        renderAllPreviews();
      }

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("bg-blue-100");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("bg-blue-100"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("bg-blue-100");
        if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
      });
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) handleFiles(e.target.files);
      });

      function handleFiles(files) {
        for (let file of files) {
          if (!file.type.startsWith("image/")) continue;
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              uploadedFiles.push({
                id:
                  "img_" +
                  Date.now() +
                  "_" +
                  Math.random().toString(36).substr(2, 9),
                file: file,
                name: file.name,
                img: img,
                config: JSON.parse(JSON.stringify(globalSettings)),
              });
              updateImageCount();
              renderAllPreviews();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      }

      function updateImageCount() {
        imageCount.textContent = uploadedFiles.length;
        if (uploadedFiles.length > 0) {
          emptyState.style.display = "none";
          btnDownloadAll.classList.remove("hidden");
        } else {
          emptyState.style.display = "block";
          btnDownloadAll.classList.add("hidden");
        }
      }

      function handleSettingChange(immediate = true) {
        const sizeVal = parseInt(canvasSizeInput.value) || 1200;
        const currentConfig = {
          canvasSize: sizeVal,
          bgColor: bgColorInput.value,
          outerColor: outerColorInput.value,
          outerSize: parseInt(outerSizeInput.value) || 0,
          innerColor: innerColorInput.value,
          innerSize: parseInt(innerSizeInput.value) || 0,
          targetScope: targetScopeSelect.value,
          borderAlign: borderAlignSelect.value,
        };

        if (selectedImageIds.length === 0) {
          globalSettings = { ...currentConfig };
          uploadedFiles.forEach((item) => (item.config = { ...currentConfig }));
        } else {
          uploadedFiles.forEach((item) => {
            if (selectedImageIds.includes(item.id)) {
              item.config = { ...currentConfig };
            }
          });
        }

        if (immediate) {
          renderAllPreviews();
        } else {
          clearTimeout(renderTimer);
          renderTimer = setTimeout(() => {
            renderAllPreviews();
          }, 30);
        }
      }

      function syncFormWithConfig(config) {
        canvasSizeInput.value = config.canvasSize;
        bgColorInput.value = config.bgColor;

        outerColorInput.value = config.outerColor;
        outerSizeInput.value = config.outerSize;
        outerSizeVal.textContent = config.outerSize + "px";

        innerColorInput.value = config.innerColor;
        innerSizeInput.value = config.innerSize;
        innerSizeVal.textContent = config.innerSize + "px";

        targetScopeSelect.value = config.targetScope;
        borderAlignSelect.value = config.borderAlign;
      }

      function updateUIForSelection() {
        if (selectedImageIds.length === 0) {
          settingsTitle.textContent = "一括編集設定";
          targetModeBadge.textContent = "全体に適用";
          targetModeBadge.className =
            "text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-100 text-blue-800";
          deleteActionArea.classList.add("hidden");
        } else if (selectedImageIds.length === 1) {
          const target = uploadedFiles.find(
            (item) => item.id === selectedImageIds[0],
          );
          settingsTitle.textContent = "個別編集設定";
          targetModeBadge.textContent = target ? target.name : "個別選択中";
          targetModeBadge.className =
            "text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 truncate max-w-[120px]";
          btnDeleteText.textContent = "この画像を削除";
          deleteActionArea.classList.remove("hidden");
        } else {
          settingsTitle.textContent = "複数選択編集設定";
          targetModeBadge.textContent = `選択中: ${selectedImageIds.length}件`;
          targetModeBadge.className =
            "text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-100 text-purple-800";
          btnDeleteText.textContent = `選択中の${selectedImageIds.length}件を削除`;
          deleteActionArea.classList.remove("hidden");
        }
      }

      function renderAllPreviews() {
        previewContainer.innerHTML = "";
        if (uploadedFiles.length === 0) {
          previewContainer.appendChild(emptyState);
          return;
        }

        uploadedFiles.forEach((item) => {
          const canvas = generateCanvas(item);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.92);

          const isSelected = selectedImageIds.includes(item.id);

          const card = document.createElement("div");
          card.className = `image-card bg-slate-50 border border-slate-200 rounded-2xl p-3 flex flex-col space-y-2 cursor-pointer transition-all ${
            isSelected
              ? "selected-card bg-amber-50/20"
              : "hover:border-blue-300"
          }`;

          card.onclick = (e) => {
            if (e.target.tagName === "A") return;
            e.stopPropagation();

            if (e.ctrlKey || e.metaKey) {
              if (isSelected) {
                selectedImageIds = selectedImageIds.filter(
                  (id) => id !== item.id,
                );
              } else {
                selectedImageIds.push(item.id);
              }
            } else {
              selectedImageIds = [item.id];
            }

            updateUIForSelection();
            if (selectedImageIds.length === 1) {
              syncFormWithConfig(item.config);
            }
            renderAllPreviews();
          };

          const sizeText = `${item.config.canvasSize}×${item.config.canvasSize}px`;

          card.innerHTML = `
                    <div class="aspect-square bg-slate-200 rounded-xl overflow-hidden border border-slate-200 relative flex items-center justify-center">
                        <img src="${dataUrl}" class="max-w-full max-h-full object-contain">
                        ${isSelected ? '<span class="absolute top-2 left-2 bg-amber-500 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-full shadow-lg">選択中</span>' : ""}
                        <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded backdrop-blur-sm">${sizeText}</span>
                    </div>
                    <div class="flex justify-between items-center text-xs text-slate-600 pt-1">
                        <span class="truncate max-w-[130px] font-medium" title="${item.name}">${item.name}</span>
                        <a href="${dataUrl}" download="${item.config.canvasSize}_${item.name.replace(/\.[^/.]+$/, "")}.jpg" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1 rounded-lg transition-all shadow-sm">
                            保存
                        </a>
                    </div>
                `;
          previewContainer.appendChild(card);
        });
      }

      // ==========================================
      // 【二軸四象限 完全分離によるキャンバス生成ロジック】
      // ==========================================
      function generateCanvas(item) {
        const cfg = item.config;
        const size = cfg.canvasSize || 1200;

        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        // 全体の背景色を塗りつぶし
        ctx.fillStyle = cfg.bgColor;
        ctx.fillRect(0, 0, size, size);

        const imgW = item.img.width;
        const imgH = item.img.height;
        const totalBorderSize = cfg.outerSize + cfg.innerSize;

        let baseBox = { x: 0, y: 0, w: size, h: size };
        let drawW = 0, drawH = 0, drawX = 0, drawY = 0;

        // 象限①：[本来の画像の部分だけ] × [外側揃え]
        if (cfg.targetScope === "image" && cfg.borderAlign === "outside") {
            const maxAllowedSize = Math.max(10, size - (totalBorderSize * 2));
            const scale = maxAllowedSize / Math.max(imgW, imgH);
            drawW = imgW * scale;
            drawH = imgH * scale;
            drawX = (size - drawW) / 2;
            drawY = (size - drawH) / 2;

            ctx.drawImage(item.img, drawX, drawY, drawW, drawH);
            baseBox = { x: drawX, y: drawY, w: drawW, h: drawH };
            drawOutsideBorders(ctx, baseBox, cfg.outerColor, cfg.outerSize, cfg.innerColor, cfg.innerSize);
        }

        // 象限②：[本来の画像の部分だけ] × [内側揃え]
        else if (cfg.targetScope === "image" && cfg.borderAlign === "inside") {
            const scale = size / Math.max(imgW, imgH);
            drawW = imgW * scale;
            drawH = imgH * scale;
            drawX = (size - drawW) / 2;
            drawY = (size - drawH) / 2;

            ctx.drawImage(item.img, drawX, drawY, drawW, drawH);
            baseBox = { x: drawX, y: drawY, w: drawW, h: drawH };
            drawInsideBorders(ctx, baseBox, cfg.outerColor, cfg.outerSize, cfg.innerColor, cfg.innerSize);
        }

        // 象限③：[キャンバス全体] × [外側揃え]
        else if (cfg.targetScope === "canvas" && cfg.borderAlign === "outside") {
            const innerCanvasSize = Math.max(10, size - (totalBorderSize * 2));
            const scale = innerCanvasSize / Math.max(imgW, imgH);
            drawW = imgW * scale;
            drawH = imgH * scale;

            const offsetX = (size - innerCanvasSize) / 2;
            const offsetY = (size - innerCanvasSize) / 2;
            drawX = offsetX + (innerCanvasSize - drawW) / 2;
            drawY = offsetY + (innerCanvasSize - drawH) / 2;

            ctx.drawImage(item.img, drawX, drawY, drawW, drawH);
            baseBox = { x: offsetX, y: offsetY, w: innerCanvasSize, h: innerCanvasSize };
            drawOutsideBorders(ctx, baseBox, cfg.outerColor, cfg.outerSize, cfg.innerColor, cfg.innerSize);
        }

        // 象限④：[キャンバス全体] × [内側揃え]
        else if (cfg.targetScope === "canvas" && cfg.borderAlign === "inside") {
            const scale = size / Math.max(imgW, imgH);
            drawW = imgW * scale;
            drawH = imgH * scale;
            drawX = (size - drawW) / 2;
            drawY = (size - drawH) / 2;

            ctx.drawImage(item.img, drawX, drawY, drawW, drawH);
            baseBox = { x: 0, y: 0, w: size, h: size };
            drawInsideBorders(ctx, baseBox, cfg.outerColor, cfg.outerSize, cfg.innerColor, cfg.innerSize);
        }

        return canvas;
      }

      // ==========================================
      // 【フチ描画ヘルパー関数】
      // ==========================================
      
      // 内側揃え：基準枠の境界から内側へ（1層目：外側橙、2層目：内側白）
      function drawInsideBorders(ctx, box, outerColor, outerSize, innerColor, innerSize) {
        ctx.save();
        let { x, y, w, h } = box;
        if (outerSize > 0) {
          ctx.fillStyle = outerColor;
          drawFrame(ctx, x, y, w, h, outerSize);
        }
        if (innerSize > 0) {
          ctx.fillStyle = innerColor;
          drawFrame(
            ctx,
            x + outerSize,
            y + outerSize,
            w - (outerSize * 2),
            h - (outerSize * 2),
            innerSize,
          );
        }
        ctx.restore();
      }

      // 外側揃え：基準枠の境界から外側へ（2層目：内側白が接し、1層目：外側橙が一番外側）
      function drawOutsideBorders(ctx, box, outerColor, outerSize, innerColor, innerSize) {
        ctx.save();
        let { x, y, w, h } = box;
        if (innerSize > 0) {
          ctx.fillStyle = innerColor;
          drawFrame(
            ctx,
            x - innerSize,
            y - innerSize,
            w + (innerSize * 2),
            h + (innerSize * 2),
            innerSize,
          );
        }
        if (outerSize > 0) {
          ctx.fillStyle = outerColor;
          const offsetEnd = innerSize + outerSize;
          drawFrame(
            ctx,
            x - offsetEnd,
            y - offsetEnd,
            w + (offsetEnd * 2),
            h + (offsetEnd * 2),
            outerSize,
          );
        }
        ctx.restore();
      }

      // 枠の塗りつぶし用描画ヘルパー
      // iPhone (Safari) のくり抜きバグを防止した描画処理
      function drawFrame(ctx, x, y, w, h, size) {
        if (w <= 0 || h <= 0 || size <= 0) return;
        
        ctx.beginPath();
        // 1. 外側の四角形
        ctx.rect(x, y, w, h);
        // 2. 内側の四角形（正の数値で指定）
        ctx.rect(x + size, y + size, w - (size * 2), h - (size * 2));
        
        // evenodd ルールを指定することで、iPhoneでも確実に内側がくり抜かれる
        ctx.fill('evenodd');
      }

      btnDownloadAll.addEventListener("click", () => {
        const links = previewContainer.querySelectorAll("a[download]");
        links.forEach((link, idx) => {
          setTimeout(() => {
            link.click();
          }, idx * 200);
        });
      });
    </script>
</body>
</html>
